x-logging: &default-logging
  driver: local
  options:
    max-size: '20m'
    max-file: '5'

services:
  postgres:
    logging: *default-logging
    image: postgres:15-alpine
    container_name: ums-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - ums-net

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: ums-redis
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - ums-net

  minio:
    logging: *default-logging
    image: ghcr.io/darknight2709/ums-minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ums-minio
    restart: always
    environment: &minio-credentials
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - ums-net

  minio-init:
    logging: *default-logging
    image: ghcr.io/darknight2709/ums-minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: never
    depends_on:
      - minio
    restart: 'no'
    environment: *minio-credentials
    volumes:
      - ./docker/minio/avatars-policy.json:/policies/avatars-policy.json:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu

        attempt=0
        until mc alias set storage http://minio:9000 \
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo "MinIO initialization failed: connection or authentication unavailable."
            exit 1
          fi
          sleep 2
        done

        mc mb --ignore-existing storage/avatars
        mc anonymous set-json /policies/avatars-policy.json storage/avatars
        echo "Avatar bucket initialization completed."
    networks:
      - ums-net

  backend:
    logging: *default-logging
    image: ghcr.io/darknight2709/ums-backend:latest
    container_name: ums-backend
    restart: always
    env_file:
      - .env
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    labels:
      com.ums.logs: 'true'
    networks:
      - ums-net

  loki:
    logging: *default-logging
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: always
    networks:
      - ums-net

  alloy:
    logging: *default-logging
    image: grafana/alloy:v1.7.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: always
    networks:
      - ums-net

  grafana:
    logging: *default-logging
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - loki
    restart: always
    networks:
      - ums-net

volumes:
  pgdata:
  redisdata:
  miniodata:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  ums-net:
    name: ums-net
    driver: bridge
