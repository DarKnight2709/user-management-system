x-logging: &default-logging
  driver: local
  options:
    max-size: '20m'
    max-file: '5'

services:
  postgres:
    logging: *default-logging
    image: postgres:15-alpine
    container_name: ums-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - ums-net

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: ums-redis
    restart: always
    # Queue jobs live here: persist them with AOF, and reject writes at the
    # memory cap (below the container limit) instead of being OOM-killed.
    # The default entrypoint is kept so redis-server drops root privileges.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '96mb',
        '--maxmemory-policy',
        'noeviction',
        '--requirepass',
        '${REDIS_PASSWORD}',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - ums-net

  minio:
    logging: *default-logging
    image: ghcr.io/darknight2709/ums-minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ums-minio
    restart: always
    # Root account: used for administration only, never by the application.
    environment: &minio-credentials
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # 256M was not enough: MinIO sat at 85% when idle and restarted itself
          # whenever minio-init asked it to create the application user.
          memory: 1G
    networks:
      - ums-net

  minio-init:
    logging: *default-logging
    image: ghcr.io/darknight2709/ums-minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: never
    depends_on:
      - minio
    restart: 'no'
    environment:
      <<: *minio-credentials
      # The application's account (S3_ACCESS_KEY/S3_SECRET_KEY in .env).
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - ./docker/minio/avatars-policy.json:/policies/avatars-policy.json:ro
      - ./docker/minio/avatars-app-policy.json:/policies/avatars-app-policy.json:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu

        if [ "$$S3_ACCESS_KEY" = "$$MINIO_ROOT_USER" ]; then
          echo "S3_ACCESS_KEY must differ from MINIO_ROOT_USER: the application must not use the root account."
          exit 1
        fi

        attempt=0
        until mc alias set storage http://minio:9000 \
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo "MinIO initialization failed: connection or authentication unavailable."
            exit 1
          fi
          sleep 2
        done

        mc mb --ignore-existing storage/avatars
        mc anonymous set-json /policies/avatars-policy.json storage/avatars

        # Least-privilege account for the application. Safe to repeat: the policy
        # is replaced, the user's secret is reset, and an existing attachment is kept.
        mc admin policy create storage avatars-app /policies/avatars-app-policy.json
        mc admin user add storage "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc admin policy attach storage avatars-app --user "$$S3_ACCESS_KEY" ||
          mc admin user info storage "$$S3_ACCESS_KEY" | grep -q avatars-app
        echo "Avatar bucket and application user initialization completed."
    networks:
      - ums-net

  backend:
    logging: *default-logging
    image: ghcr.io/darknight2709/ums-backend:${BACKEND_IMAGE_TAG:-latest}
    container_name: ums-backend
    restart: always
    env_file:
      - .env
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    labels:
      com.ums.logs: 'true'
    networks:
      - ums-net

  loki:
    logging: *default-logging
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: always
    networks:
      - ums-net

  alloy:
    logging: *default-logging
    image: grafana/alloy:v1.7.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: always
    networks:
      - ums-net

  grafana:
    logging: *default-logging
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - loki
    restart: always
    networks:
      - ums-net

volumes:
  pgdata:
  redisdata:
  miniodata:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  ums-net:
    name: ums-net
    driver: bridge
