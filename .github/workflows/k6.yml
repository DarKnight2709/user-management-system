name: Performance (k6 smoke)

# Starts the backend image inside the runner with throw-away PostgreSQL and
# Redis services and runs performance/smoke.js against it. It never touches a
# deployed environment. Numbers from a shared runner are only comparable with
# other runs of this workflow; they say nothing about VPS capacity.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Which k6 script to run (the weekly schedule always runs smoke)'
        type: choice
        default: smoke
        options:
          - smoke
          - load
          - stress
          - login
          - writes
      users:
        description: 'Override the number of virtual users (empty = script default)'
        type: string
        required: false
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  k6-smoke:
    name: k6 smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ums_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ums_perf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throw-away values for a container that lives only for this job.
      # NODE_ENV=production is required: the script relies on trust proxy = 1
      # so each virtual user can present its own IP through X-Forwarded-For.
      APP_ENV_ARGS: >-
        -e NODE_ENV=production
        -e PORT=3000
        -e DATABASE_URL=postgresql://test:test@localhost:5432/ums_perf
        -e JWT_ACCESS_TOKEN_SECRET=perf-jwt-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG
        -e JWT_REFRESH_TOKEN_SECRET=perf-jwt-refresh-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG
        -e INVITATION_TOKEN_SECRET=perf-invitation-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG
        -e ACCOUNT_TOKEN_SECRET=perf-account-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJ
        -e S3_ENDPOINT=http://localhost:9000
        -e S3_BUCKET=ums-perf
        -e S3_ACCESS_KEY=perf-access
        -e S3_SECRET_KEY=perf-secret
        -e S3_PUBLIC_URL=http://localhost:9000
        -e FRONTEND_URL=http://localhost:3000
        -e REDIS_HOST=localhost
        -e SMTP_HOST=localhost
        -e SMTP_FROM=perf@example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ums-backend:perf .

      - name: Apply database migrations
        run: docker run --rm --network host $APP_ENV_ARGS ums-backend:perf npx prisma migrate deploy --config prisma7.config.ts

      # Organization creation needs the permission catalog, as in deployment.
      # This only touches the throw-away database of this job.
      - name: Seed organization permission catalog
        run: docker run --rm --network host $APP_ENV_ARGS ums-backend:perf npm run prisma:seed:organization-permissions

      - name: Start backend
        # Same CPU and memory limits as the backend in docker-compose.prod.yml.
        run: docker run -d --name ums-backend --network host --cpus=1 --memory=512m $APP_ENV_ARGS ums-backend:perf

      - name: Wait for backend to become healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ums-backend)
            echo "backend health: $status ($i/30)"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker logs --tail 80 ums-backend
          exit 1

      - name: Run k6 script
        env:
          SCRIPT: ${{ inputs.script || 'smoke' }}
          USERS: ${{ inputs.users }}
        run: |
          mkdir -p k6-results && chmod 777 k6-results
          users_arg=""
          if [ -n "$USERS" ]; then
            case "$USERS" in
              *[!0-9]*) echo "users must be a number"; exit 1 ;;
            esac
            users_arg="-e USERS=$USERS"
          fi
          docker run --rm --network host \
            -v "$PWD/performance:/scripts:ro" \
            -v "$PWD/k6-results:/results" \
            -e BASE_URL=http://localhost:3000 \
            $users_arg \
            grafana/k6:2.3.0 run \
              --summary-export "/results/$SCRIPT-summary.json" \
              "/scripts/$SCRIPT.ts"

      - name: Show backend resource usage
        if: always()
        run: docker stats --no-stream ums-backend

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: k6-results/*-summary.json
          if-no-files-found: ignore

      - name: Show backend logs on failure
        if: failure()
        run: docker logs --tail 80 ums-backend
