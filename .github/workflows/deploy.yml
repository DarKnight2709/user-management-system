name: Build, Migrate and Deploy Backend

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ums_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ums_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      JWT_ACCESS_TOKEN_SECRET: 'test-jwt-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG'
      JWT_REFRESH_TOKEN_SECRET: 'test-jwt-refresh-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG'
      INVITATION_TOKEN_SECRET: 'test-invitation-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG'
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ums-test
      S3_ACCESS_KEY: test-access
      S3_SECRET_KEY: test-secret
      S3_PUBLIC_URL: http://localhost:9000
      FRONTEND_URL: http://localhost:3000
      REDIS_HOST: localhost
      SMTP_HOST: localhost
      SMTP_FROM: test@example.com
      RUN_AUTH_E2E_TESTS: 'true'
      RUN_USERS_E2E_TESTS: 'true'
      RUN_AUDIT_E2E_TESTS: 'true'
      RUN_DATABASE_TESTS: 'true'
      RUN_ADMIN_ORGANIZATION_E2E_TESTS: 'true'
      RUN_INVITATION_E2E_TESTS: 'true'
      RUN_ORGANIZATION_MEMBERS_E2E_TESTS: 'true'
      RUN_ORGANIZATION_OWNERSHIP_E2E_TESTS: 'true'
      RUN_ORGANIZATION_ROLES_E2E_TESTS: 'true'
      RUN_ORGANIZATIONS_E2E_TESTS: 'true'
      DATABASE_URL: postgresql://test:test@localhost:5432/ums_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      # E2E suites boot the full app against this throwaway database; some
      # requests (e.g. login) query the users table even when they are rejected.
      - name: Apply database migrations
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Run E2E tests
        run: npm run test:e2e
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  trivy-fs-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan source code
        run: semgrep scan --config p/typescript --error

  build-and-push-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, secret-scan, trivy-fs-scan, semgrep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: DarKnight2709
          password: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once into the local daemon so it can be scanned before publishing.
      - name: Build Backend Image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/darknight2709/ums-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/darknight2709/ums-backend:scan
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Rebuild is served from the layer cache populated above.
      - name: Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # The commit tag is what the VPS deploys and rolls back to.
          tags: |
            ghcr.io/darknight2709/ums-backend:latest
            ghcr.io/darknight2709/ums-backend:${{ github.sha }}
          cache-from: type=gha

  deploy-to-vps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Bung file .env từ Secret ENV_PRODUCTION
      - name: Create .env file from GitHub Secret
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      # 2. Copy Compose and observability configuration to the VPS
      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.prod.yml,.env,scripts/deploy.sh,docker/minio/avatars-policy.json,alloy/config.alloy,loki/loki-config.yaml,grafana/provisioning'
          target: '~/app'

      # 3. Thực thi kéo Image mới, Migrate DB, Up container và Dọn rác
      - name: Execute deployment & migration on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u DarKnight2709 --password-stdin

            cd ~/app

            # Backup, migrate, start, health check and rollback live in the script.
            bash scripts/deploy.sh "${{ github.sha }}"
