name: Build, Migrate and Deploy Backend

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ums_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ums_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      JWT_ACCESS_TOKEN_SECRET: 'test-jwt-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG'
      JWT_REFRESH_TOKEN_SECRET: 'test-jwt-refresh-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG'
      INVITATION_TOKEN_SECRET: 'test-invitation-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG'
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ums-test
      S3_ACCESS_KEY: test-access
      S3_SECRET_KEY: test-secret
      S3_PUBLIC_URL: http://localhost:9000
      FRONTEND_URL: http://localhost:3000
      REDIS_HOST: localhost
      SMTP_HOST: localhost
      SMTP_FROM: test@example.com
      RUN_DATABASE_TESTS: 'true'
      DATABASE_URL: postgresql://test:test@localhost:5432/ums_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run migration
        run: npm run test:integration

      - name: Run E2E tests
        run: npm run test:e2e
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  trivy-fs-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,misconfig

  build-and-push-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, secret-scan, trivy-fs-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: DarKnight2709
          password: ${{ secrets.GH_PAT }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/darknight2709/ums-backend:latest

  deploy-to-vps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Bung file .env từ Secret ENV_PRODUCTION
      - name: Create .env file from GitHub Secret
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      # 2. Copy Compose and observability configuration to the VPS
      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.prod.yml,.env,docker/minio/avatars-policy.json,alloy/config.alloy,loki/loki-config.yaml,grafana/provisioning'
          target: '~/app'

      # 3. Thực thi kéo Image mới, Migrate DB, Up container và Dọn rác
      - name: Execute deployment & migration on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u DarKnight2709 --password-stdin

            cd ~/app

            # Pull backend and centralized logging images
            docker compose -f docker-compose.prod.yml pull backend loki alloy grafana

            # Chạy Prisma migration bằng temporary container
            docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy

            # Seed catalog quyền sau khi migration thành công.
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
            npm run prisma:seed:organization-permissions

            # Khởi chạy/Cập nhật các service
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Dọn dẹp rác image cũ để giải phóng dung lượng ổ cứng VPS
            docker image prune -f
