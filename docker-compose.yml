services:
  postgres:
    image: postgres:17
    container_name: user_system-postgres
    restart: always
    environment:
      POSTGRES_USER: postgredb
      POSTGRES_PASSWORD: postgredb
      POSTGRES_DB: user_management_system
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
