services:
  postgres:
    image: postgres:17
    container_name: user_system-postgres
    restart: always
    environment:
      POSTGRES_USER: postgredb
      POSTGRES_PASSWORD: postgredb
      POSTGRES_DB: user_management_system
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: user_system-minio
    restart: always
    command: server /data --console-address ":9001"
    environment: &minio-credentials
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: never
    depends_on:
      - minio
    restart: 'no'
    environment: *minio-credentials
    volumes:
      - ./docker/minio/avatars-policy.json:/policies/avatars-policy.json:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu

        attempt=0
        until mc alias set storage http://minio:9000 \
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo "MinIO initialization failed: connection or authentication unavailable."
            exit 1
          fi
          sleep 2
        done

        mc mb --ignore-existing storage/avatars
        mc anonymous set-json /policies/avatars-policy.json storage/avatars
        echo "Avatar bucket initialization completed."
volumes:
  postgres_data:
  minio_data:
