# Local development only. Production requires separate deployment configuration.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
  postgres:
    image: postgres:17
    container_name: user_system-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: user_system-minio
    restart: always
    command: server /data --console-address ":9001"
    environment: &minio-credentials
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: never
    depends_on:
      - minio
    restart: 'no'
    environment: *minio-credentials
    volumes:
      - ./docker/minio/avatars-policy.json:/policies/avatars-policy.json:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu

        attempt=0
        until mc alias set storage http://minio:9000 \
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo "MinIO initialization failed: connection or authentication unavailable."
            exit 1
          fi
          sleep 2
        done

        mc mb --ignore-existing storage/avatars
        mc anonymous set-json /policies/avatars-policy.json storage/avatars
        echo "Avatar bucket initialization completed."
volumes:
  redis_data:
  postgres_data:
  minio_data:
